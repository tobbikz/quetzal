# Quetzal desk — Postgres 16 (schema quetzal) + Next app
# Host port 5433 avoids clashing with a local Postgres on :5432.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quetzal
      POSTGRES_PASSWORD: ${QUETZAL_PG_PASSWORD:-quetzal}
      POSTGRES_DB: quetzal
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:${QUETZAL_PG_PORT:-5433}:5432"
    volumes:
      - quetzal_pg:/var/lib/postgresql/data
      # Creates schema `quetzal` on first boot; QZ-PG-1 migrations mount optionally.
      - ./db/docker-init:/docker-entrypoint-initdb.d:ro
      - ./db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quetzal -d quetzal"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # search_path is also set in lib/pg.ts; options reinforce it for ad-hoc clients.
      QUETZAL_DATABASE_URL: postgresql://quetzal:${QUETZAL_PG_PASSWORD:-quetzal}@db:5432/quetzal
      NODE_ENV: production
      PORT: "3210"
      HOSTNAME: 0.0.0.0
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:${QUETZAL_APP_PORT:-3210}:3210"
    volumes:
      - quetzal_uploads:/app/data/uploads
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3210/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    restart: unless-stopped

volumes:
  quetzal_pg:
  quetzal_uploads:
